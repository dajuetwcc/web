<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>《用數學解人生題》動態腳本預覽</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;900&family=Noto+Sans+TC:wght@300;400;500&family=IBM+Plex+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0a0a0a;
  --paper:#f2f0ea;
  --white:#efefe9;
  --grey:#6b6b66;
  --red:#d9302a;
  --mono:'IBM Plex Mono',monospace;
  --serif:'Noto Serif TC',serif;
  --sans:'Noto Sans TC',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;background:#050505;color:var(--white);font-family:var(--sans);overflow:hidden;}

/* ===== 舞台 16:9 ===== */
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#050505;}
#stage{
  position:relative;background:var(--ink);overflow:hidden;
  aspect-ratio:16/9;width:min(100vw,177.78vh);
  box-shadow:0 0 120px rgba(0,0,0,.9);
}

/* ===== 場景通用 ===== */
.scene{position:absolute;inset:0;display:none;align-items:center;justify-content:center;}
.scene.active{display:flex;}

/* 字幕列 */
#subtitle{
  position:absolute;left:0;right:0;bottom:7%;text-align:center;z-index:40;
  font-family:var(--serif);font-weight:600;
  font-size:clamp(16px,3.2cqw,34px);letter-spacing:.12em;
  color:var(--white);text-shadow:0 2px 22px rgba(0,0,0,.85);
  opacity:0;transition:opacity .5s;
  padding:0 6%;
}
#stage{container-type:size;}
#subtitle.show{opacity:1;}
#subtitle .em{color:var(--red);}

/* ===== S1 公式雨 ===== */
#s1 .formula{
  position:absolute;font-family:var(--mono);color:var(--white);
  white-space:nowrap;opacity:.85;
}
#s1.zeroed .formula{color:var(--grey);}
@keyframes flick{0%,100%{opacity:.9}50%{opacity:.25}}
#s1 .formula.jitter{animation:flick .18s steps(2) infinite;}
#s1 .fadeall{transition:opacity 1.2s;}

/* ===== S2 巨大問號 ===== */
#s2 .qmark,#s3 .qmark{
  font-family:var(--serif);font-weight:900;
  font-size:clamp(120px,38cqh,420px);line-height:1;
  color:var(--white);
}
#s2 .qmark{animation:qin 1.1s cubic-bezier(.16,1,.3,1) both;}
@keyframes qin{from{opacity:0;transform:scale(.7);filter:blur(14px)}to{opacity:1;transform:scale(1);filter:blur(0)}}

/* ===== S3 變成紅色 × ===== */
#s3 .qmark{position:relative;}
#s3 .q{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;animation:qin .35s cubic-bezier(.16,1,.3,1) both, glitchout .4s steps(3) .8s both;}
#s3 .x{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--red);opacity:0;animation:xin .35s steps(2) 1.1s both;}
@keyframes glitchout{0%{opacity:1;transform:translateX(0)}40%{opacity:1;transform:translateX(-8px) skewX(6deg)}70%{opacity:.5;transform:translateX(10px)}100%{opacity:0}}
@keyframes xin{0%{opacity:0;transform:scale(1.5)}60%{opacity:1;transform:scale(.94)}100%{opacity:1;transform:scale(1)}}
#s3.shake{animation:shake .25s linear 1.1s 1;}
@keyframes shake{0%,100%{transform:translate(0)}25%{transform:translate(-6px,3px)}50%{transform:translate(5px,-4px)}75%{transform:translate(-3px,2px)}}

/* ===== 生活場景（S4–S7 抽象化真人畫面）===== */
.life{position:absolute;inset:0;}
.vignette{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 30%,rgba(0,0,0,.88) 100%);pointer-events:none;}

/* S4 深夜的人與手機光 */
#s4 .room{position:absolute;inset:0;background:linear-gradient(180deg,#0d0d10 0%,#08080a 100%);}
#s4 .glow{
  position:absolute;left:50%;top:56%;width:34cqw;height:34cqw;transform:translate(-50%,-50%);
  background:radial-gradient(circle,rgba(140,170,220,.32),transparent 65%);
  animation:breathe 3s ease-in-out infinite;
}
@keyframes breathe{0%,100%{opacity:.7}50%{opacity:1}}
#s4 .figure{
  position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);
  width:16cqw;height:26cqw;border-radius:50% 50% 12% 12%/60% 60% 8% 8%;
  background:#000;box-shadow:0 0 60px rgba(0,0,0,.9);
}
.frag{
  position:absolute;font-family:var(--mono);color:rgba(230,230,225,.55);
  font-size:clamp(10px,1.5cqw,16px);letter-spacing:.15em;
  opacity:0;animation:fragin 1s ease both;
}
@keyframes fragin{from{opacity:0;transform:translateY(12px)}to{opacity:.75;transform:translateY(0)}}

/* S5 失敗訊息 */
#s5 .card{
  width:52cqw;background:#101012;border:1px solid #232326;border-radius:10px;
  padding:2.2cqw 2.6cqw;font-family:var(--sans);
  animation:cardin .45s cubic-bezier(.16,1,.3,1) both;
  box-shadow:0 30px 80px rgba(0,0,0,.7);
}
@keyframes cardin{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}
#s5 .card .bar{display:flex;align-items:center;gap:.6cqw;margin-bottom:1.6cqw;}
#s5 .dot{width:.8cqw;height:.8cqw;border-radius:50%;background:#2c2c30;}
#s5 .line{height:.9cqw;border-radius:99px;background:#1d1d21;margin:.9cqw 0;}
#s5 .line.short{width:62%;}
#s5 .line.red{background:rgba(217,48,42,.32);width:78%;}
#s5 .stamp{
  margin-top:1.8cqw;display:inline-block;border:2px solid var(--red);color:var(--red);
  font-family:var(--mono);font-size:clamp(11px,1.6cqw,18px);letter-spacing:.3em;
  padding:.5cqw 1.2cqw;transform:rotate(-4deg);
  animation:stampin .3s steps(2) .55s both;
}
@keyframes stampin{from{opacity:0;transform:rotate(-4deg) scale(1.6)}to{opacity:1;transform:rotate(-4deg) scale(1)}}

/* S6 社群捲動 */
#s6 .feed{
  position:absolute;left:50%;top:0;transform:translateX(-50%);
  width:34cqw;animation:scrollfeed 2.8s cubic-bezier(.3,0,.7,1) both;
}
@keyframes scrollfeed{from{transform:translate(-50%,10%)}to{transform:translate(-50%,-62%)}}
#s6 .post{
  background:#101012;border:1px solid #222226;border-radius:10px;
  margin-bottom:1.4cqw;padding:1.4cqw;
}
#s6 .ph{display:flex;align-items:center;gap:.9cqw;margin-bottom:1cqw;}
#s6 .av{width:2.4cqw;height:2.4cqw;border-radius:50%;background:#26262b;}
#s6 .pn{height:.8cqw;width:9cqw;background:#1d1d21;border-radius:99px;}
#s6 .pic{height:12cqw;border-radius:6px;background:linear-gradient(135deg,#1a1a20,#242430);display:flex;align-items:center;justify-content:center;
  font-family:var(--sans);font-size:clamp(10px,1.5cqw,16px);color:#8a8a92;letter-spacing:.3em;}
#s6 .likes{margin-top:.9cqw;height:.7cqw;width:6cqw;background:#1d1d21;border-radius:99px;}

/* S7 岔路 */
#s7 svg{width:100%;height:100%;}
#s7 .roadback{stroke:var(--grey);animation:fadeaway 2.4s ease .5s both;}
@keyframes fadeaway{to{opacity:.08}}
#s7 .figure2{
  position:absolute;left:50%;top:57%;transform:translate(-50%,-50%);
  width:3.4cqw;height:8cqw;border-radius:50% 50% 20% 20%/55% 55% 10% 10%;background:#000;
  box-shadow:0 0 40px rgba(0,0,0,.9);
}

/* S8 等式 */
#s8 .eq{
  font-family:var(--mono);font-weight:300;
  font-size:clamp(28px,7cqw,84px);letter-spacing:.1em;color:var(--white);
  animation:eqin .8s ease both;
}
@keyframes eqin{from{opacity:0;filter:blur(8px)}to{opacity:1;filter:blur(0)}}
#s8 .eq .u{color:var(--grey);}

/* S9 等式化為白紙 */
#s9 .paper{
  width:34cqw;aspect-ratio:1/1.38;background:var(--paper);
  box-shadow:0 40px 120px rgba(0,0,0,.8);
  display:flex;align-items:flex-start;justify-content:flex-start;
  padding:3cqw 2.6cqw;position:relative;
  animation:paperin 2.2s cubic-bezier(.22,1,.36,1) both;
}
@keyframes paperin{from{transform:scale(.82);opacity:0}30%{opacity:1}to{transform:scale(1.08);opacity:1}}
#s9 .paper .pline{position:absolute;left:2.6cqw;right:2.6cqw;height:1px;background:rgba(10,10,10,.12);}
#s9 .eqfade{
  font-family:var(--mono);color:rgba(10,10,10,.85);
  font-size:clamp(14px,2.6cqw,30px);
  animation:inkfade 1.6s ease .4s both;
}
@keyframes inkfade{to{opacity:.1;filter:blur(2px)}}

/* S10 課程名稱逐字出現 */
#s10 .title{
  font-family:var(--serif);font-weight:900;
  font-size:clamp(34px,8.5cqw,110px);letter-spacing:.18em;color:var(--white);
  display:flex;
}
#s10 .title span{opacity:0;animation:charin .5s cubic-bezier(.16,1,.3,1) both;}
@keyframes charin{from{opacity:0;transform:translateY(.4em)}to{opacity:1;transform:none}}
#s10 .brackets{font-family:var(--serif);color:var(--grey);}

/* S11 交錯閃切 */
#s11{background:var(--ink);}
#s11 .flash{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;}
#s11 .flash.f-formula{font-family:var(--mono);font-size:clamp(18px,4cqw,48px);color:var(--white);letter-spacing:.1em;}
#s11 .flash.f-life{background:#0d0d10;}
#s11 .flash.f-life .glow2{width:30cqw;height:30cqw;border-radius:50%;background:radial-gradient(circle,rgba(150,175,220,.25),transparent 65%);}
#s11 .flash.on{animation:flashcut .28s steps(1) both;}
@keyframes flashcut{0%{opacity:1}100%{opacity:1}}

/* S12 收乾淨 */
#s12 .title2{
  font-family:var(--serif);font-weight:900;
  font-size:clamp(30px,7cqw,92px);letter-spacing:.2em;color:var(--white);
  animation:slowin 1.6s ease both;
}
@keyframes slowin{from{opacity:0}to{opacity:1}}

/* S13 Logo */
#s13 .logo{display:flex;flex-direction:column;align-items:center;gap:2.4cqw;animation:slowin 1.4s ease both;}
#s13 .mark{
  width:9cqw;height:9cqw;border:2px solid var(--white);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-weight:900;font-size:clamp(22px,4.4cqw,54px);color:var(--white);
  position:relative;
}
#s13 .mark::after{
  content:"";position:absolute;inset:-.9cqw;border:1px solid rgba(239,239,233,.25);border-radius:50%;
}
#s13 .lt{font-family:var(--serif);font-weight:900;font-size:clamp(24px,5cqw,64px);letter-spacing:.22em;color:var(--white);}
#s13 .ls{font-family:var(--sans);font-weight:300;font-size:clamp(12px,2cqw,22px);letter-spacing:.55em;color:var(--grey);text-indent:.55em;}

/* ===== 控制列 ===== */
#controls{
  position:absolute;left:0;right:0;bottom:0;z-index:60;
  padding:14px 18px 12px;display:flex;flex-direction:column;gap:8px;
  background:linear-gradient(transparent,rgba(0,0,0,.85));
  transition:opacity .4s;font-family:var(--sans);
}
#controls.hidden{opacity:0;pointer-events:none;}
#progress{position:relative;height:4px;background:rgba(255,255,255,.15);border-radius:99px;cursor:pointer;}
#progress .fill{position:absolute;left:0;top:0;bottom:0;background:var(--red);border-radius:99px;width:0%;}
#progress .marks{position:absolute;inset:0;}
#progress .mk{position:absolute;top:-2px;width:1px;height:8px;background:rgba(255,255,255,.3);}
#cbar{display:flex;align-items:center;gap:14px;font-size:13px;color:#cfcfc9;}
#cbar button{
  background:none;border:1px solid rgba(255,255,255,.25);color:var(--white);
  border-radius:6px;padding:5px 14px;cursor:pointer;font-family:var(--sans);font-size:13px;
}
#cbar button:hover{border-color:var(--white);}
#cbar button:focus-visible{outline:2px solid var(--red);outline-offset:2px;}
#timecode{font-family:var(--mono);font-size:12px;color:#9a9a94;min-width:92px;}
#scenename{flex:1;text-align:right;font-size:12px;color:#8a8a84;letter-spacing:.08em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#hint{
  position:absolute;top:14px;right:16px;z-index:60;font-size:11px;color:#71716b;
  letter-spacing:.1em;font-family:var(--sans);transition:opacity .4s;
}
#hint.hidden{opacity:0;}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01s !important;transition-duration:.01s !important;}
}
</style>
</head>
<body>
<div id="wrap">
<div id="stage">

  <!-- S1 0–4s -->
  <div class="scene" id="s1"><div class="fadeall" id="s1inner"></div></div>

  <!-- S2 4–7s -->
  <div class="scene" id="s2"><div class="qmark">？</div></div>

  <!-- S3 7–10s -->
  <div class="scene" id="s3">
    <div class="qmark">
      <div class="q">？</div>
      <div class="x">×</div>
      <span style="visibility:hidden">？</span>
    </div>
  </div>

  <!-- S4 10–17s -->
  <div class="scene" id="s4">
    <div class="life">
      <div class="room"></div>
      <div class="glow"></div>
      <div class="figure"></div>
      <div class="frag" style="left:16%;top:24%;animation-delay:.25s">deadline 23:58</div>
      <div class="frag" style="right:14%;top:32%;animation-delay:.7s">未讀 47</div>
      <div class="frag" style="left:22%;bottom:26%;animation-delay:1.15s">如果當初⋯⋯</div>
      <div class="frag" style="right:20%;bottom:20%;animation-delay:1.6s">P(成功) = ?</div>
      <div class="vignette"></div>
    </div>
  </div>

  <!-- S5 17–22s -->
  <div class="scene" id="s5">
    <div class="card">
      <div class="bar"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
      <div class="line short"></div>
      <div class="line"></div>
      <div class="line red"></div>
      <div class="line short"></div>
      <div class="stamp">FAILED × 1</div>
    </div>
    <div class="vignette"></div>
  </div>

  <!-- S6 22–27s -->
  <div class="scene" id="s6">
    <div class="feed" id="feed"></div>
    <div class="vignette"></div>
  </div>

  <!-- S7 27–32s -->
  <div class="scene" id="s7">
    <svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
      <path class="roadback" d="M800 900 L800 520" fill="none" stroke-width="70" stroke-linecap="round" opacity=".45"/>
      <path d="M800 520 L560 140" fill="none" stroke="#efefe9" stroke-width="46" stroke-linecap="round" opacity=".7" stroke-dasharray="460" stroke-dashoffset="460">
        <animate attributeName="stroke-dashoffset" from="460" to="0" dur="1.3s" begin="0.4s" fill="freeze"/>
      </path>
      <path d="M800 520 L1040 140" fill="none" stroke="#efefe9" stroke-width="46" stroke-linecap="round" opacity=".7" stroke-dasharray="460" stroke-dashoffset="460">
        <animate attributeName="stroke-dashoffset" from="460" to="0" dur="1.3s" begin="0.4s" fill="freeze"/>
      </path>
    </svg>
    <div class="figure2"></div>
    <div class="vignette"></div>
  </div>

  <!-- S8 32–36s -->
  <div class="scene" id="s8">
    <div class="eq">人生 <span class="u">=</span> <span class="u">?</span></div>
  </div>

  <!-- S9 36–40s -->
  <div class="scene" id="s9">
    <div class="paper">
      <div class="pline" style="top:30%"></div>
      <div class="pline" style="top:45%"></div>
      <div class="pline" style="top:60%"></div>
      <div class="pline" style="top:75%"></div>
      <div class="eqfade">人生 = ?</div>
    </div>
  </div>

  <!-- S10 40–44s -->
  <div class="scene" id="s10">
    <div class="title">
      <span class="brackets" style="animation-delay:.05s">《</span><span style="animation-delay:.2s">用</span><span style="animation-delay:.35s">數</span><span style="animation-delay:.5s">學</span><span style="animation-delay:.65s">解</span><span style="animation-delay:.8s">人</span><span style="animation-delay:.95s">生</span><span style="animation-delay:1.1s">題</span><span class="brackets" style="animation-delay:1.25s">》</span>
    </div>
  </div>

  <!-- S11 44–49s -->
  <div class="scene" id="s11">
    <div class="flash f-formula" data-t="0">∫ f(x) dx</div>
    <div class="flash f-life" data-t="0.35"><div class="glow2"></div></div>
    <div class="flash f-formula" data-t="0.7">lim n→∞</div>
    <div class="flash f-life" data-t="1.05"><div class="glow2" style="background:radial-gradient(circle,rgba(220,190,150,.22),transparent 65%)"></div></div>
    <div class="flash f-formula" data-t="1.4">P(A|B)</div>
    <div class="flash f-life" data-t="1.75"><div class="glow2" style="background:radial-gradient(circle,rgba(160,220,180,.2),transparent 65%)"></div></div>
    <div class="flash f-formula" data-t="2.1">x → y</div>
  </div>

  <!-- S12 49–54s -->
  <div class="scene" id="s12">
    <div class="title2">用數學解人生題</div>
  </div>

  <!-- S13 54–58s -->
  <div class="scene" id="s13">
    <div class="logo">
      <div class="mark">解</div>
      <div class="lt">用數學解人生題</div>
      <div class="ls">即將開始・敬請期待</div>
    </div>
  </div>

  <!-- 字幕 -->
  <div id="subtitle"></div>

  <!-- 控制列 -->
  <div id="hint">空白鍵播放／暫停・H 隱藏控制列（觸控裝置雙擊畫面）</div>
  <div id="controls">
    <div id="progress"><div class="marks" id="marks"></div><div class="fill" id="fill"></div></div>
    <div id="cbar">
      <button id="playbtn">▶ 播放</button>
      <button id="restartbtn">⟲ 重播</button>
      <button id="voicebtn" title="開啟或關閉旁白配音">🔊 旁白：開</button>
      <select id="ratesel" title="旁白語速" style="background:#111;color:#efefe9;border:1px solid rgba(255,255,255,.25);border-radius:6px;padding:4px 6px;font-family:var(--sans);font-size:12px;">
        <option value="0.85">語速 慢</option>
        <option value="0.95" selected>語速 中</option>
        <option value="1.1">語速 快</option>
      </select>
      <span id="timecode">00:00 / 00:58</span>
      <span id="scenename"></span>
    </div>
  </div>

</div>
</div>

<script>
/* ========= 時間軸定義（依腳本） ========= */
const SCENES = [
  {id:'s1',  start:0,   end:3.5, name:'S1 公式閃現・歸零（快）',   sub:'有些人生問題，不是沒有答案。', voice:'有些人生問題，不是沒有答案。'},
  {id:'s3',  start:3.5, end:6,   name:'S2 ？碎成紅色×（合併一拍）', sub:'而是——<span class="em">你算錯了。</span>', voice:'而是，你算錯了。'},
  {id:'s4',  start:6,   end:9,   name:'S3 深夜・手機',            sub:'把「可能」，算成「一定」。', voice:'把可能，算成一定。'},
  {id:'s5',  start:9,   end:12,  name:'S4 失敗的結果',            sub:'把一次失敗，算成永遠。', voice:'把一次失敗，算成永遠。'},
  {id:'s6',  start:12,  end:15.5,name:'S5 社群媒體快滑',          sub:'把別人的答案，算成自己的標準。', voice:'把別人的答案，算成自己的標準。'},
  {id:'s7',  start:15.5,end:19.5,name:'S6 岔路口',               sub:'把失去的，算成必須繼續的理由。', voice:'把失去的，算成必須繼續的理由。'},
  {id:'s8',  start:19.5,end:22.5,name:'S7 黑畫面・等式',          sub:'如果人生，也是一道題——', voice:'如果人生，也是一道題。'},
  {id:'s9',  start:22.5,end:25,  name:'S8 等式化為白紙',          sub:'你會怎麼算？', voice:'你，會怎麼算？'},
  {id:'s10', start:25,  end:28,  name:'S9 課程名稱逐字出現',       sub:'', voice:'用數學，解人生題。'},
  {id:'s11', start:28,  end:31,  name:'S10 公式與生活快切',        sub:'不是教你算數學。', voice:'不是教你算數學。'},
  {id:'s12', start:31,  end:34,  name:'S11 收乾淨・標題',          sub:'而是讓你重新學會思考。', voice:'而是讓你，重新學會思考。'},
  {id:'s13', start:34,  end:37.5,name:'S12 Logo・敬請期待',       sub:'', voice:'用數學解人生題，敬請期待。'},
];
const TOTAL = 37.5;

/* ========= S1 公式雨生成 ========= */
const FORMULAS = ['E = mc²','P(A∩B)','∑ xᵢ / n','f(x) = ax + b','lim x→0','√(a²+b²)','dy/dx','x² − 4x + 4 = 0','∫₀¹ f dt','n! / k!(n−k)!','σ² = Var(X)','y = e^x'];
const s1inner = document.getElementById('s1inner');
let s1timer = null;
function buildS1(){
  s1inner.innerHTML = '';
  s1inner.style.opacity = 1;
  document.getElementById('s1').classList.remove('zeroed');
  for(let i=0;i<26;i++){
    const el = document.createElement('div');
    el.className = 'formula jitter';
    el.textContent = FORMULAS[i % FORMULAS.length];
    el.style.left = (Math.random()*86+2)+'%';
    el.style.top = (Math.random()*88+2)+'%';
    el.style.fontSize = (Math.random()*1.6+0.9)+'cqw';
    el.style.animationDelay = (Math.random()*0.5)+'s';
    s1inner.appendChild(el);
  }
}
function s1Enter(){
  buildS1();
  clearInterval(s1timer);
  /* 隨機替換字元製造「算錯」感 */
  s1timer = setInterval(()=>{
    const els = s1inner.querySelectorAll('.formula');
    const el = els[Math.floor(Math.random()*els.length)];
    if(el) el.textContent = FORMULAS[Math.floor(Math.random()*FORMULAS.length)];
  },120);
  /* 1.6 秒後全部歸零（加速） */
  s1zero = setTimeout(()=>{
    clearInterval(s1timer);
    s1inner.querySelectorAll('.formula').forEach(el=>{
      el.classList.remove('jitter');
      el.textContent = '0';
    });
    document.getElementById('s1').classList.add('zeroed');
    setTimeout(()=>{ s1inner.style.opacity = 0; },350);
  },1600);
}
let s1zero=null;
function s1Exit(){ clearInterval(s1timer); clearTimeout(s1zero); }

/* ========= S6 社群貼文生成 ========= */
const POSTS = ['升職了 🎉','新家入手','馬爾地夫 Day 3','年薪翻倍','提早退休計畫','馬拉松完賽','創業第一桶金','婚禮花絮'];
function buildFeed(){
  const feed = document.getElementById('feed');
  feed.innerHTML = '';
  POSTS.forEach(t=>{
    feed.insertAdjacentHTML('beforeend',
      `<div class="post"><div class="ph"><div class="av"></div><div class="pn"></div></div><div class="pic">${t}</div><div class="likes"></div></div>`);
  });
  /* 重啟捲動動畫 */
  feed.style.animation='none'; void feed.offsetWidth; feed.style.animation='';
}

/* ========= S11 閃切 ========= */
let s11timers=[];
function s11Enter(){
  const flashes = document.querySelectorAll('#s11 .flash');
  flashes.forEach(f=>f.classList.remove('on'));
  flashes.forEach(f=>{
    const t = parseFloat(f.dataset.t)*1000;
    s11timers.push(setTimeout(()=>{
      flashes.forEach(o=>o.classList.remove('on'));
      f.classList.add('on');
    },t));
  });
  /* 2.6 秒後全暗，準備進下一場 */
  s11timers.push(setTimeout(()=>{
    flashes.forEach(o=>o.classList.remove('on'));
  },2600));
}
function s11Exit(){ s11timers.forEach(clearTimeout); s11timers=[]; }

/* ========= 旁白配音（Web Speech API）========= */
let voiceOn = true;
let zhVoice = null;
let voiceRate = 0.95;

function pickVoice(){
  if(!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices();
  /* 優先順序：zh-TW > zh-HK > 任何 zh */
  zhVoice = vs.find(v=>/zh[-_]TW/i.test(v.lang))
         || vs.find(v=>/zh[-_]HK/i.test(v.lang))
         || vs.find(v=>/^zh/i.test(v.lang))
         || null;
}
if('speechSynthesis' in window){
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}

let speakGen = 0;
function speak(text){
  if(!voiceOn || !text || !('speechSynthesis' in window)) return;
  const myGen = ++speakGen;
  speechSynthesis.cancel();
  /* Chrome 等瀏覽器 cancel() 後立刻 speak() 常有瞬間重疊，留一點緩衝時間讓佇列真正清空 */
  setTimeout(()=>{
    if(myGen !== speakGen) return; /* 這期間又切了下一句，放棄這句 */
    const u = new SpeechSynthesisUtterance(text);
    u.lang = zhVoice ? zhVoice.lang : 'zh-TW';
    if(zhVoice) u.voice = zhVoice;
    u.rate = voiceRate;
    u.pitch = 0.92;   /* 略低沉，配合冷靜懸疑的調性 */
    speechSynthesis.speak(u);
  }, 60);
}
function stopSpeak(){
  speakGen++; /* 讓任何排隊中、尚未真正開口的 speak() 作廢 */
  if('speechSynthesis' in window) speechSynthesis.cancel();
}

/* ========= 場景引擎 ========= */
const stageEl = document.getElementById('stage');
const subEl = document.getElementById('subtitle');
const fill = document.getElementById('fill');
const timecode = document.getElementById('timecode');
const scenename = document.getElementById('scenename');
const playbtn = document.getElementById('playbtn');
const controls = document.getElementById('controls');
const hint = document.getElementById('hint');

let playing=false, t=0, raf=null, last=null, current=-1, finished=false;

const HOOKS = {
  s1:{enter:s1Enter, exit:s1Exit},
  s3:{enter:()=>{const s=document.getElementById('s3');s.classList.remove('shake');void s.offsetWidth;s.classList.add('shake');}},
  s6:{enter:buildFeed},
  s11:{enter:s11Enter, exit:s11Exit},
};

function resetSceneAnimations(id){
  const el = document.getElementById(id);
  el.querySelectorAll('*').forEach(n=>{
    if(n.getAnimations){ n.getAnimations().forEach(a=>{a.cancel();}); }
  });
  /* 觸發 reflow 重跑 CSS 動畫 */
  el.style.display='none'; void el.offsetWidth; el.style.display='';
}

function setScene(idx){
  if(idx===current) return;
  if(current>=0){
    const prev = SCENES[current];
    document.getElementById(prev.id).classList.remove('active');
    if(HOOKS[prev.id] && HOOKS[prev.id].exit) HOOKS[prev.id].exit();
  }
  current = idx;
  const sc = SCENES[idx];
  const el = document.getElementById(sc.id);
  resetSceneAnimations(sc.id);
  el.classList.add('active');
  if(HOOKS[sc.id] && HOOKS[sc.id].enter) HOOKS[sc.id].enter();
  /* 字幕 */
  if(sc.sub){
    subEl.innerHTML = sc.sub;
    subEl.classList.remove('show'); void subEl.offsetWidth;
    setTimeout(()=>subEl.classList.add('show'),300);
  } else {
    subEl.classList.remove('show');
  }
  scenename.textContent = sc.name;
  /* 旁白配音 */
  if(playing && sc.voice) speak(sc.voice);
}

function fmt(s){const m=Math.floor(s/60),ss=Math.floor(s%60);return String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0');}

function tick(now){
  if(!playing) return;
  if(last===null) last=now;
  t += (now-last)/1000;
  last = now;
  if(t>=TOTAL){ t=TOTAL; pause(); finished=true; playbtn.textContent='⟲ 重播'; }
  const idx = SCENES.findIndex(s=>t>=s.start && t<s.end);
  if(idx>=0) setScene(idx);
  else if(t>=TOTAL) setScene(SCENES.length-1);
  fill.style.width = (t/TOTAL*100)+'%';
  timecode.textContent = fmt(t)+' / '+fmt(TOTAL);
  raf = requestAnimationFrame(tick);
}

function play(){
  if(finished){ seek(0); finished=false; }
  playing=true; last=null;
  playbtn.textContent='❚❚ 暫停';
  /* 從暫停處恢復時，唸出目前場景旁白 */
  if(current>=0 && SCENES[current].voice) speak(SCENES[current].voice);
  raf=requestAnimationFrame(tick);
}
function pause(){
  playing=false;
  stopSpeak();
  if(raf) cancelAnimationFrame(raf);
  playbtn.textContent= finished ? '⟲ 重播' : '▶ 播放';
}
function toggle(){ playing ? pause() : play(); }

function seek(sec){
  /* 跳到該場景開頭，動畫從頭跑（分鏡預覽用） */
  stopSpeak();
  const idx = Math.max(0, SCENES.findIndex(s=>sec>=s.start && sec<s.end));
  const target = idx>=0 ? SCENES[idx] : SCENES[SCENES.length-1];
  t = target.start;
  finished=false;
  current=-1;
  setScene(SCENES.indexOf(target));
  fill.style.width = (t/TOTAL*100)+'%';
  timecode.textContent = fmt(t)+' / '+fmt(TOTAL);
  last=null;
}

playbtn.addEventListener('click',toggle);
const voicebtn=document.getElementById('voicebtn');
voicebtn.addEventListener('click',()=>{
  voiceOn=!voiceOn;
  voicebtn.textContent = voiceOn ? '🔊 旁白：開' : '🔇 旁白：關';
  if(!voiceOn) stopSpeak();
  else if(playing && current>=0 && SCENES[current].voice) speak(SCENES[current].voice);
});
document.getElementById('ratesel').addEventListener('change',e=>{
  voiceRate=parseFloat(e.target.value);
});
document.getElementById('restartbtn').addEventListener('click',()=>{seek(0); if(!playing) play();});
document.getElementById('progress').addEventListener('click',e=>{
  const r=e.currentTarget.getBoundingClientRect();
  seek(((e.clientX-r.left)/r.width)*TOTAL);
});

/* 進度條場景刻度 */
const marks=document.getElementById('marks');
SCENES.forEach(s=>{
  if(s.start===0) return;
  const mk=document.createElement('div');
  mk.className='mk'; mk.style.left=(s.start/TOTAL*100)+'%';
  marks.appendChild(mk);
});

/* 鍵盤 */
let controlsHidden=false;
document.addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();toggle();}
  if(e.key==='h'||e.key==='H'){
    controlsHidden=!controlsHidden;
    controls.classList.toggle('hidden',controlsHidden);
    hint.classList.toggle('hidden',controlsHidden);
  }
  if(e.key==='ArrowRight'){ seek(Math.min(TOTAL-0.01, SCENES[Math.min(current+1,SCENES.length-1)].start)); }
  if(e.key==='ArrowLeft'){ seek(SCENES[Math.max(current-1,0)].start); }
});

/* 播放時滑鼠靜止自動隱藏控制列 */
let hideTimer=null;
stageEl.addEventListener('mousemove',()=>{
  if(controlsHidden) return;
  controls.classList.remove('hidden'); hint.classList.remove('hidden');
  clearTimeout(hideTimer);
  hideTimer=setTimeout(()=>{ if(playing){controls.classList.add('hidden');hint.classList.add('hidden');} },2200);
});

/* 觸控裝置（iPhone 等）：雙擊畫面切換控制列顯示／隱藏，因為沒有鍵盤 H 鍵可按 */
let lastTap=0;
stageEl.addEventListener('touchend',(e)=>{
  const now=Date.now();
  if(now-lastTap<350){
    controlsHidden=!controlsHidden;
    controls.classList.toggle('hidden',controlsHidden);
    hint.classList.toggle('hidden',controlsHidden);
    e.preventDefault();
  }
  lastTap=now;
});

/* 初始畫面 */
seek(0);
pause();
</script>
